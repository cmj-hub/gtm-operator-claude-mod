name: evals

# Manual only: each case calls the model and is billed to the key's account.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      # The scaffold copies each pack's scorers from repos cloned next to this
      # one, so check this repo out one level down and the packs beside it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: gtm-operator-claude-mod
      - name: Skip without a key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "No ANTHROPIC_API_KEY secret; skipping evals."
      - name: Clone the ten packs
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          for repo in claude-psp claude-evp claude-prospect-list claude-cold-email claude-sales-offer \
                      claude-pricing claude-landing-page claude-email-sequence claude-geo claude-founder-brand; do
            git clone --depth 1 "https://github.com/cmj-hub/$repo.git" "$repo"
          done
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: Run mod evals
        if: env.ANTHROPIC_API_KEY != ''
        working-directory: gtm-operator-claude-mod
        # 0.75: a run may leave out a score it was given; the guard case must still hold.
        run: >-
          claude plugin eval . --trust-plugin --scaffold --no-publish --threshold 0.75
          --allow-tools Write Edit mcp__gtm-operator__gtm_status mcp__gtm-operator__gtm_score
